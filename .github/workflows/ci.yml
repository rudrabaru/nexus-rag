name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (correctness rules only)
        run: ruff check src scripts tests
      - name: Tests
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t nexus-api:ci .
      - name: Image must contain no secrets or local state
        run: |
          leaked=0
          for path in .env data sources observability retrieval logs.txt tests docs; do
            if docker run --rm --entrypoint sh nexus-api:ci -c "[ -e /app/$path ]"; then
              echo "::error::/app/$path is present in the image"
              leaked=1
            fi
          done
          exit $leaked

  # Manual only: spends embedding quota and needs repository secrets QDRANT_URL,
  # QDRANT_API_KEY and JINA_API_KEY. Runs the dense configuration because it is
  # deterministic and needs no local state; the hybrid baseline needs the local
  # SQLite index, which moves to Postgres in a later step.
  retrieval-gate:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Evaluate against the live collection
        run: python -m src.retrieving.eval_runner --dataset evaluation_datasets/benchmark.json --output-dir retrieval/ci
      - name: Fail on regression against the frozen baseline
        run: |
          candidate=$(ls -d retrieval/ci/eval_*/ | tail -1)evaluation_metrics.json
          python -m src.retrieving.baseline_check evaluation_datasets/baselines/dense_top5.json "$candidate"
