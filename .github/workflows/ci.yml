name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      spec:
        description: "Experiment spec for the retrieval gate (empty = skip the gate)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres + pgvector for tests/integration. Credentials are throwaway: the
    # container exists only for this job and is unreachable from outside the runner.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11" # matches Dockerfile.api and Dockerfile.worker
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: CPU-only torch (Docling's dependency; the CUDA build is several GB)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: pip install -r requirements-dev.txt
      - name: Lint (correctness rules only)
        run: ruff check src scripts tests admin_ui
      - name: Tests (unit + Postgres integration)
        run: pytest -q -rs

  # Known vulnerabilities in the pinned direct dependencies and everything they pull in, and
  # secrets committed anywhere in the history.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Dependency vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-api.txt -r requirements-worker.txt
      - name: Committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the API image
        run: docker build -f Dockerfile.api -t nexus-api:ci .
      - name: Build the worker image
        run: docker build -f Dockerfile.worker -t nexus-worker:ci .
      - name: Build the admin UI image
        run: docker build -f Dockerfile.ui -t nexus-ui:ci .
      - name: The admin UI image holds the UI only, as an unprivileged user
        run: |
          [ "$(docker inspect --format '{{.Config.User}}' nexus-ui:ci)" = "nexus" ]
          if docker run --rm --entrypoint sh nexus-ui:ci -c "[ -e /app/src ] || [ -e /app/.env ]"; then
            echo "::error::the UI image carries backend code or secrets"; exit 1
          fi
      - name: Images must contain no secrets or local state
        run: |
          leaked=0
          for image in nexus-api:ci nexus-worker:ci; do
            for path in .env data sources observability retrieval logs.txt tests docs scripts evaluation_datasets .claude; do
              if docker run --rm --entrypoint sh "$image" -c "[ -e /app/$path ]"; then
                echo "::error::/app/$path is present in $image"
                leaked=1
              fi
            done
          done
          exit $leaked
      - name: Images must run as an unprivileged user and the API image must declare a healthcheck
        run: |
          for image in nexus-api:ci nexus-worker:ci; do
            user=$(docker inspect --format '{{.Config.User}}' "$image")
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
          done
          docker inspect --format '{{.Config.Healthcheck}}' nexus-api:ci | grep -q CMD
      - name: Images must carry what the startup schema check needs
        run: |
          for image in nexus-api:ci nexus-worker:ci; do
            docker run --rm --entrypoint sh "$image" -c "[ -f /app/alembic.ini ] && [ -d /app/migrations/versions ]"
          done
      - name: The API image must not carry document-parsing dependencies
        # The slim/heavy split is only real if this holds: the parse worker (Dockerfile.worker)
        # is the sole place Docling, torch and PyMuPDF are installed.
        run: |
          for pkg in docling torch pymupdf; do
            if docker run --rm --entrypoint python nexus-api:ci -c "import $pkg" 2>/dev/null; then
              echo "::error::$pkg is importable in the API image; it belongs in the worker image only"
              exit 1
            fi
          done
      - name: The API image must be able to run the fetch worker's tasks
        run: docker run --rm --entrypoint python nexus-api:ci -c "import src.jobs.fetch_tasks"
      - name: The API image must carry the default reranker's model (no download on a query)
        run: docker run --rm --entrypoint sh nexus-api:ci -c "ls /opt/flashrank/ms-marco-TinyBERT-L-2-v2/*.onnx"
      - name: The worker image must be able to import its task module and Docling
        run: docker run --rm --entrypoint python nexus-worker:ci -c "import src.jobs.ingest_tasks, docling.document_converter"

  # Manual only: spends embedding quota and needs repository secrets DATABASE_URL and
  # VOYAGE_API_KEY. Runs an experiment spec (src/evaluation/spec.py) against the live index and
  # fails when any trial is significantly worse than the spec's baseline trial. Needs an
  # ingested corpus and a dataset for it (synthetic test sets, item 11).
  retrieval-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.spec != ''
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      ADMIN_API_KEY: ci-gate-unused
      GEMINI_API_KEY: ci-gate-unused  # retrieval-only specs call no LLM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: CPU-only torch (Docling's dependency; the CUDA build is several GB)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: pip install -r requirements-dev.txt
      - name: Run the experiment and gate on significant regressions
        # Passed through the environment, never interpolated into the script: a dispatch input is
        # attacker-controllable text.
        env:
          SPEC: ${{ inputs.spec }}
        run: python -m src.evaluation run "$SPEC" --fail-on-regression
